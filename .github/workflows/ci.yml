name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']

# A new push to a PR replaces its run. Master keeps a run for every commit.
concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    # The same services and ports as deploy/compose.yaml. Nothing else uses this
    # Redis, so TEST_REDIS_ADDR lets the tests that delete keys run too.
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 63809:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: s2g
          POSTGRES_PASSWORD: s2g
          POSTGRES_DB: s2g
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U s2g" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_REDIS_ADDR: 127.0.0.1:63809
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run ./cmd/s2g migrate
      # A test that cannot reach its service skips, and a skip looks like a pass.
      # Here every service is up, so any skip means a test silently stopped running.
      - name: Test, and fail on any skip
        shell: bash
        run: |
          go test -race -count=1 -v ./... 2>&1 | tee test.log
          echo "passed: $(grep -cE '^ *--- PASS' test.log), skipped: $(grep -cE '^ *--- SKIP' test.log || true)"
          ! grep -E '^ *--- SKIP' test.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/bundle-budget.mjs

  # Every user flow in headless Chrome. The YouTube API is a recorded fixture and the
  # player a stand-in, so no key is needed and nothing here can fail because of YouTube.
  flows:
    # The dearest job by far: drafts wait until they're marked ready.
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # A new push to a PR replaces its run. Every commit on master keeps its own.
    concurrency:
      group: flows-${{ github.head_ref || github.sha }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: s2g
          POSTGRES_PASSWORD: s2g
          POSTGRES_DB: s2g
        ports:
          - 5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U s2g" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Nothing here can stop the flows running. apt has hung for longer than this whole
      # job, which says nothing about the code, so it's never needed for a run to go ahead.
      # Bump the samples key when the samples in e2e/lib/stack.mjs change.
      - uses: actions/cache@v4
        id: samples
        with:
          path: .data
          key: flows-samples-v1
      - uses: actions/cache@v4
        id: fonts
        with:
          path: ~/.local/share/fonts
          key: flows-fonts-v1
      # stack.mjs makes the samples with ffmpeg. The services need Docker Hub anyway, so
      # taking ffmpeg from there adds no new way to fail.
      - name: Use ffmpeg from Docker
        if: steps.samples.outputs.cache-hit != 'true'
        run: |
          mkdir -p .data "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec docker run --rm -v "%s:%s" linuxserver/ffmpeg:7.1.1 "$@"\n' "$PWD/.data" "$PWD/.data" > "$RUNNER_TEMP/bin/ffmpeg"
          chmod +x "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Real Korean and emoji for the layout checks to measure. Best effort: without them
      # the flows still pass, and the next run tries again.
      - name: Fonts, if apt will give them
        if: steps.fonts.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          timeout 150 sudo sh -c 'apt-get -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update && apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji'
          mkdir -p ~/.local/share/fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf ~/.local/share/fonts/
      - run: fc-cache -f
      - run: npm ci
        working-directory: e2e
      # Known failures print but don't fail. A new one gets a second try on its own: a
      # regression fails both, and one that recovers warns as flaky.
      - name: Run the flows
        working-directory: e2e
        env:
          FLOWS_REDIS_CONTAINER: ${{ job.services.redis.id }}
          FLOWS_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TMPDIR: ${{ runner.temp }}
        run: node flows.mjs --shard ${{ matrix.shard }}/3 --concurrency 2 --retries 1 --keep --label "shard ${{ matrix.shard }}" --out "$RUNNER_TEMP/flows"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flows-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/flows
            ${{ runner.temp }}/s2g-flows-*/server.log
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  voice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      # Tokens and Twirp calls are signed by hand, so only the real server can say they work.
      - name: Test against the pinned LiveKit
        run: |
          export LIVEKIT_URL=ws://127.0.0.1:17880 LIVEKIT_API_KEY=ci LIVEKIT_API_SECRET=$(openssl rand -hex 24)
          LIVEKIT_KEYS="$LIVEKIT_API_KEY: $LIVEKIT_API_SECRET" docker compose -f ../deploy/compose.yaml --profile voice up -d livekit
          for _ in $(seq 1 100); do curl -sf http://127.0.0.1:17880/ >/dev/null && break; sleep 0.2; done
          go test -count=1 -tags livekit -run LiveKit -v ./internal/voice
