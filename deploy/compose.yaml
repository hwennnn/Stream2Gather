name: stream2gather

services:
  postgres:
    image: postgres:17-alpine
    shm_size: 1g
    environment:
      POSTGRES_USER: s2g
      POSTGRES_PASSWORD: s2g
      POSTGRES_DB: s2g
    ports:
      - 127.0.0.1:54339:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U s2g]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - 127.0.0.1:63809:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_USER: s2g
      CLICKHOUSE_PASSWORD: s2g
      CLICKHOUSE_DB: s2g
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - 127.0.0.1:18133:8123
      - 127.0.0.1:19010:9000
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: 262144
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1:8123/ping]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - 127.0.0.1:3011:3000
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse:
        condition: service_healthy

  # Off for `make up`: it won't start without keys, and rooms run without it.
  livekit:
    profiles: [voice]
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:-}
    ports:
      - 127.0.0.1:17880:17880
      - 127.0.0.1:17881:17881
      - 127.0.0.1:17882:17882/udp
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres:
  clickhouse:
